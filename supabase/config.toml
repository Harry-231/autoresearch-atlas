project_id = "autoresearch-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.migrations]
enabled = true
schema_paths = [
  "./schemas/00_extensions.sql",
  "./schemas/01_crucible.sql",
  "./schemas/02_security.sql",
]

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = false
