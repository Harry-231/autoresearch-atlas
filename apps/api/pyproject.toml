[project]
name = "autoresearch-api"
version = "0.1.0"
description = "FastAPI control-plane foundation for Autoresearch Atlas."
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "mcp>=1.2.0",
  "neo4j>=5.28.0",
  "pydantic-settings>=2.7.0",
  "pyyaml>=6.0.0",
  "redis>=5.2.0",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
crucible = "autoresearch_api.cli:main"
crucible-mcp = "autoresearch_api.mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
