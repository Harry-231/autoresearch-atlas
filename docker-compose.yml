services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autoresearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # 54322 matches the default DATABASE_URL so the app + tests need no changes.
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init runs once on an empty data dir, in filename order. Roles first
      # (02_security.sql revokes from anon/authenticated), then the declarative schema.
      - ./docker/postgres-init/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./supabase/schemas/00_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
      - ./supabase/schemas/01_crucible.sql:/docker-entrypoint-initdb.d/02_crucible.sql:ro
      - ./supabase/schemas/02_security.sql:/docker-entrypoint-initdb.d/03_security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: autoresearch-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/autoresearch
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p autoresearch 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: autoresearch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: autoresearch-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: autoresearch-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 2
        done
        mc mb --ignore-existing local/crucible-artifacts
        mc anonymous set none local/crucible-artifacts

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:
